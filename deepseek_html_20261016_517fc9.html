<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#002B4A">
<meta name="description" content="Sri Viswa School Management System">
<title>Sri Viswa School — Management System</title>
<link rel="icon" type="image/png" href="./assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sv-navy:#002B4A;
  --sv-blue:#005799;
  --sv-bright-blue:#2E83C6;
  --sv-green:#00923F;
  --sv-gold:#E0A800;
  --sv-gold-light:#FFC107;
  --sv-red:#D32F2F;
  --muted:#607789;
  --border:rgba(0,43,74,0.10);
  --wa-green:#25D366;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  min-height:100vh;
  font-family:"Inter",system-ui,sans-serif;
  color:var(--sv-navy);
  background:
    radial-gradient(circle at 10% 10%,rgba(46,131,198,0.14),transparent 32%),
    radial-gradient(circle at 90% 85%,rgba(0,146,63,0.09),transparent 30%),
    linear-gradient(135deg,#FFFFFF 0%,#F4F8FC 55%,#EEF5FA 100%);
  overflow-x:hidden;
  padding-top:var(--safe-top);
  display:flex;
  flex-direction:column;
  position:relative;
}

/* Grid overlay */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0,43,74,0.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,43,74,0.028) 1px,transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
  z-index:0;
}

/* Watermark */
body::after{
  content:"";
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:min(70vw,520px);
  height:min(70vw,520px);
  background:url("./assets/logo.png") center/contain no-repeat;
  opacity:0.045;
  pointer-events:none;
  z-index:0;
}

/* ============ MAIN ============ */
.main{
  flex:1;
  position:relative;
  z-index:2;
  max-width:640px;
  width:100%;
  margin:0 auto;
  padding:36px 20px 24px;
  display:flex;
  flex-direction:column;
}

/* ============ HERO ============ */
.hero{text-align:center;margin-bottom:32px;}
.hero-logo{
  width:96px;height:96px;
  object-fit:contain;
  margin:0 auto 18px;
  display:block;
  filter:drop-shadow(0 8px 20px rgba(0,43,74,0.14));
  animation:fadeUp 0.6s ease both;
}
.hero-logo-fb{
  width:96px;height:96px;
  border-radius:24px;
  background:linear-gradient(135deg,#005799,#002B4A);
  color:#fff;
  font-family:"Playfair Display",serif;
  font-weight:800;
  font-size:34px;
  display:none;
  align-items:center;
  justify-content:center;
  margin:0 auto 18px;
  box-shadow:0 12px 28px rgba(0,43,74,0.22);
}
.hero h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(26px,5.5vw,34px);
  font-weight:800;
  line-height:1.15;
  background:linear-gradient(135deg,var(--sv-navy) 0%,var(--sv-blue) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin-bottom:8px;
  animation:fadeUp 0.6s 0.05s ease both;
}
.hero-sub{
  font-size:11.5px;
  font-weight:700;
  letter-spacing:2.4px;
  text-transform:uppercase;
  color:var(--sv-green);
  animation:fadeUp 0.6s 0.1s ease both;
}
.hero-divider{
  width:56px;height:3px;
  background:linear-gradient(90deg,var(--sv-gold),var(--sv-gold-light));
  border-radius:3px;
  margin:16px auto 0;
  animation:fadeUp 0.6s 0.15s ease both;
}

/* ============ CARDS GRID ============ */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:28px;
}

.card{
  position:relative;
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px 16px 20px;
  text-align:center;
  cursor:pointer;
  transition:transform 0.28s cubic-bezier(.34,1.56,.64,1),box-shadow 0.28s,border-color 0.28s;
  box-shadow:0 6px 18px rgba(0,43,74,0.06);
  text-decoration:none;
  color:inherit;
  display:block;
  overflow:hidden;
  animation:fadeUp 0.55s ease both;
}
.card:nth-child(1){animation-delay:0.15s;}
.card:nth-child(2){animation-delay:0.20s;}
.card:nth-child(3){animation-delay:0.25s;}
.card:nth-child(4){animation-delay:0.30s;}

.card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:4px;
  background:linear-gradient(90deg,var(--accent,#005799),transparent 90%);
  opacity:0;
  transition:opacity 0.3s;
}
.card:hover{
  transform:translateY(-5px);
  border-color:var(--accent,var(--sv-blue));
  box-shadow:0 18px 36px rgba(0,43,74,0.12);
}
.card:hover::before{opacity:1;}
.card:active{transform:translateY(-2px) scale(0.985);}

.card-icon{
  width:64px;height:64px;
  border-radius:20px;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  color:#fff;
  position:relative;
  box-shadow:0 8px 20px rgba(0,43,74,0.18);
}
.card-icon::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:20px;
  background:linear-gradient(135deg,rgba(255,255,255,0.35),transparent 60%);
  pointer-events:none;
}

/* Card variants */
.card--teacher  {--accent:#005799;}
.card--teacher  .card-icon{background:linear-gradient(135deg,#005799,#002B4A);}
.card--office   {--accent:#00923F;}
.card--office   .card-icon{background:linear-gradient(135deg,#00923F,#22a35f);}
.card--principal{--accent:#E0A800;}
.card--principal .card-icon{background:linear-gradient(135deg,#FFC107,#E0A800);color:#002B4A;}
.card--parent   {--accent:#2E83C6;}
.card--parent   .card-icon{background:linear-gradient(135deg,#2E83C6,#005799);}

.card-title{
  font-size:16px;
  font-weight:800;
  color:var(--sv-navy);
  margin-bottom:4px;
  letter-spacing:0.2px;
}
.card-desc{
  font-size:11px;
  font-weight:600;
  color:var(--muted);
  line-height:1.4;
  letter-spacing:0.2px;
}

/* ============ FOOTER ============ */
.footer{
  text-align:center;
  padding:20px 20px calc(20px + var(--safe-bottom));
  position:relative;
  z-index:2;
  border-top:1px solid var(--border);
}
.footer-text{
  font-size:11px;
  font-weight:600;
  color:var(--muted);
  letter-spacing:0.6px;
  margin-bottom:12px;
}
.footer-text strong{
  color:var(--sv-blue);
  font-weight:800;
  letter-spacing:1px;
}

/* Premium icon buttons */
.footer-icons{
  display:inline-flex;
  gap:14px;
  align-items:center;
  justify-content:center;
}

.icon-btn{
  width:44px;height:44px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border:1px solid var(--border);
  box-shadow:0 4px 12px rgba(0,43,74,0.08);
  transition:transform 0.25s cubic-bezier(.34,1.56,.64,1),box-shadow 0.25s,border-color 0.25s,background 0.25s;
  text-decoration:none;
  position:relative;
}
.icon-btn svg{
  width:20px;height:20px;
  display:block;
  transition:transform 0.25s;
}
.icon-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 22px rgba(0,43,74,0.16);
}
.icon-btn:active{transform:translateY(-1px) scale(0.96);}

.icon-btn--phone{border-color:rgba(0,87,153,0.25);}
.icon-btn--phone svg{fill:var(--sv-blue);}
.icon-btn--phone:hover{background:rgba(0,87,153,0.06);border-color:var(--sv-blue);}

.icon-btn--wa{border-color:rgba(37,211,102,0.35);}
.icon-btn--wa svg{fill:var(--wa-green);}
.icon-btn--wa:hover{background:rgba(37,211,102,0.08);border-color:var(--wa-green);}

/* ============ ANIMATIONS ============ */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}

/* ============ RESPONSIVE ============ */
@media (max-width:360px){
  .grid{gap:10px;}
  .card{padding:20px 12px 16px;}
  .card-icon{width:56px;height:56px;font-size:26px;border-radius:18px;}
  .card-icon::after{border-radius:18px;}
  .card-title{font-size:15px;}
  .hero-logo{width:84px;height:84px;}
}
</style>
</head>
